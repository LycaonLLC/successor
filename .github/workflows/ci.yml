name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  denylist:
    name: denylist gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run denylist check
        run: bash tools/denylist/check.sh

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release

  rust-wasm:
    name: cargo test (wasm)
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p successor-wasm --target wasm32-unknown-unknown --release

  node:
    name: pnpm test
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v7
      - name: hydrate LFS assets exercised by tests
        run: >
          git lfs pull
          --include="client-3d/public/assets/pawn-pack/equipment/Under/boots_canvas_ankle.glb,client-3d/public/assets/pawn-pack/equipment/Under/under_bodysuit.glb,client-3d/public/assets/pawn-pack/equipment/Under/gloves_knuckled_half.glb,client-3d/public/assets/pawn-pack/weapons/custom/scrapline_machete.glb,client-3d/public/assets/pawn-pack/weapons/custom/field_saber.glb,client-3d/public/assets/pawn-pack/weapons/custom/quarry_chopper.glb,client-3d/public/assets/pawn-pack/weapons/custom/wpn_smg_sten_mk2.glb,client-3d/public/assets/pawn-pack/weapons/custom/wpn_carbine_kiln.glb,client-3d/public/assets/pawn-pack/weapons/custom/lightning_carbine.glb,client-3d/public/assets/pawn-pack/vibrosword.glb,client-3d/public/assets/pawn-pack/pawn_male.glb,client-3d/public/assets/pawn-pack/special/droid_grok_humanoid.glb,client-3d/public/assets/world-items/travel_terminal_grok_wedge.glb,client-3d/public/assets/world-items/travel_terminal_grok_wedge_screen.png"
          --exclude=""
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: node-authority-bridge
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm -r build
      - run: cargo build --locked -p successor-sim --example authority_bridge_server
      - name: test site
        run: pnpm --dir site test
      - name: test shared client
        run: pnpm --dir client test
      - name: test graphical client
        run: pnpm --dir client-3d test
      - name: test terminal client
        run: pnpm --dir client-tui test
      - name: test desktop packaging
        run: pnpm --dir desktop test
      - name: test server serially
        run: pnpm --dir server test:ci

  provenance:
    name: provenance audit
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3
      - run: python3 tools/provenance-audit/audit.py
