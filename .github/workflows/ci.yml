name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  denylist:
    name: denylist gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run denylist check
        run: bash tools/denylist/check.sh

  rust:
    name: cargo test
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release

  rust-wasm:
    name: cargo test (wasm)
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p successor-wasm --target wasm32-unknown-unknown --release

  node:
    name: pnpm test
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - run: pnpm -r build
      - run: pnpm -r test

  provenance:
    name: provenance audit
    runs-on: ubuntu-latest
    needs: denylist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install blake3
      - run: python3 tools/provenance-audit/audit.py
